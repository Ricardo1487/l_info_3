{% extends "base.html" %}

{% block content %}
  <div class="page-header">
    <h1 class="page-title">Neue Box anlegen</h1>
    <p class="page-subtitle">
      Bitte gib die Box-Nummer ein. Die Anwendung legt dann die Box
      (z. B. <code>BOX-023</code>) an und erzeugt einen QR-Code.
    </p>
  </div>

  <div class="card">
    {% if error %}
      <div class="error-banner">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" class="form">
        <div class="form-group">
            <label for="box_code">Box-Nummer</label>
            <input id="box_code"
                   name="box_code"
                   type="text"
                   placeholder="z.B. 23"
                   value="{{ box_code or '' }}"
                   inputmode="numeric"
                   pattern="[0-9]{1,3}"
                   maxlength="3"
                   oninput="
                        this.value = this.value.replace(/[^0-9]/g,'').slice(0,3);
                   "
                   required>
            <p class="field-hint">
                Nur Zahl (1–3 Stellen). <code>BOX-</code> wird automatisch ergänzt.
            </p>
        </div>

      <div class="form-group">
        <button type="submit" class="btn-primary full-width">
          Box anlegen
        </button>
      </div>
    </form>
  </div>
{% endblock %}
