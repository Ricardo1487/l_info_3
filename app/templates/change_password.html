{% extends "base.html" %}

{% block content %}
<section class="page-header">
    <h1 class="page-title">Passwort ändern</h1>
</section>

{% if error %}
<div class="alert alert-error">
    {{ error }}
</div>
{% endif %}

<section class="card">
    <form method="POST" class="form">
        <div class="form-group">
            <label for="current_password">Aktuelles Passwort</label>
            <input id="current_password" name="current_password" type="password" required>
        </div>

        <div class="form-group">
            <label for="new_password">Neues Passwort</label>
            <input id="new_password" name="new_password" type="password" required>
        </div>

        <div class="form-group">
            <label for="new_password_confirm">Neues Passwort (Wiederholung)</label>
            <input id="new_password_confirm" name="new_password_confirm" type="password" required>
        </div>

        <button class="btn-primary full-width" style="margin-top: 0.8rem;">
            Speichern
        </button>
    </form>
</section>
{% endblock %}
