{% extends "base.html" %}
{% block content %}

<h1>Bilder vergleichen</h1>

<form action="{{ url_for('images_compare') }}" method="post" enctype="multipart/form-data">
    <div>
        <label for="image_before">Vorher-Bild:</label><br>
        <input type="file" name="image_before" id="image_before" required>
    </div>

    <div style="margin-top: 1rem;">
        <label for="image_after">Nachher-Bild:</label><br>
        <input type="file" name="image_after" id="image_after" required>
    </div>

    <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Vergleichen</button>
</form>

{% endblock %}
