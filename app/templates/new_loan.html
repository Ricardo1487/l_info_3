{% extends "base.html" %}

{% block content %}

<section class="page-header">
    <h1 class="page-title">Neue Leihe</h1>
</section>

{% if error_message %}
<div class="alert alert-error">
    {{ error_message }}
</div>
{% endif %}

<section class="card">

<form id="new-loan-form" action="{{ url_for('save_loan') }}" method="post" enctype="multipart/form-data" class="form">

    <!-- Box-Code -->
    <div class="form-group">
        <label for="box_code">Box-Code</label>
        <input id="box_code" name="box_code" type="text" placeholder="BOX-001" required>
    </div>

    <!-- Kontakt -->
    <div class="form-group">
        <label for="email">E-Mail</label>
        <input id="email" name="email" type="email" required>
    </div>

    <!-- Datumsauswahl -->
    <div class="form-group-inline">
        <div class="form-group">
            <label for="ausgabe">Ausgabe</label>
            <input id="ausgabe" name="ausgabe" type="date" min="{{ current_date }}" required>
        </div>

        <div class="form-group">
            <label for="rueckgabe">Rückgabe</label>
            <input id="rueckgabe" name="rueckgabe" type="date" required>
        </div>
    </div>

    <!-- Verfügbarkeits-"Kalender" -->
    <div class="form-group">
        <label>Verfügbarkeit dieser Box</label>
        <div id="availability-calendar" class="availability-calendar">
            <p class="cal-placeholder">Bitte Box-Code eingeben, um Verfügbarkeit zu laden.</p>
        </div>
    </div>

    <!-- Foto -->
    <div class="form-group">
        <label for="photo">Foto der Box</label>
        <input id="photo" type="file" name="photo" accept="image/*" required>
    </div>

    <button class="btn-primary full-width">Leihe speichern</button>

</form>

</section>

<!-- Kalender Styles -->
<style>
.alert.alert-error {
  background: rgba(248,113,113,0.15);
  border: 1px solid #f87171;
  color: #fecaca;
  padding: 0.75rem 1rem;
  border-radius: 0.75rem;
  margin-bottom: 1rem;
  font-size: 0.9rem;
}

.availability-calendar {
  background: rgba(15,23,42,0.45);
  border-radius: 0.75rem;
  padding: 0.75rem;
  font-size: 0.8rem;
  color: #e2e8f0;
}

.cal-placeholder {
  opacity: 0.65;
  font-size: 0.85rem;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 0.75rem;
}

.cal-day-header {
  text-align: center;
  opacity: 0.55;
  font-size: 0.7rem;
}

.cal-day {
  text-align: center;
  padding: 6px 0;
  border-radius: 8px;
  font-size: 0.75rem;
  transition: 0.15s;
}

.cal-day-free {
  background: rgba(34,197,94,0.2);
}

.cal-day-busy {
  background: rgba(248,113,113,0.25);
}

.cal-legend {
  display: flex;
  gap: 1rem;
  margin-top: 0.75rem;
  font-size: 0.75rem;
  opacity: 0.75;
}

.cal-legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 999px;
  display: inline-block;
}

.cal-legend-dot.busy {
  background: rgba(248,113,113,0.9);
}

.cal-legend-dot.free {
  background: rgba(34,197,94,0.9);
}

.input-error {
  border: 1px solid #f87171 !important;
}
</style>


<!-- Kalender + Overlap JS -->
<script>
document.addEventListener("DOMContentLoaded", () => {

    const boxInput = document.getElementById("box_code");
    const ausgabe = document.getElementById("ausgabe");
    const rueckgabe = document.getElementById("rueckgabe");
    const calendar = document.getElementById("availability-calendar");

    let periods = []; // vom Backend geladen

    // ----------- Datum-Validierung ------------
    ausgabe.addEventListener("change", () => {
        rueckgabe.min = ausgabe.value;
        checkOverlapAndStyle();
    });

    rueckgabe.addEventListener("change", () => {
        checkOverlapAndStyle();
    });

    // ----------- Verfügbarkeit laden ------------
    boxInput.addEventListener("blur", fetchAvailability);
    boxInput.addEventListener("change", fetchAvailability);

    async function fetchAvailability() {
        const code = boxInput.value.trim();
        if (!code) {
            periods = [];
            calendar.innerHTML = "<p class='cal-placeholder'>Bitte Box-Code eingeben, um Verfügbarkeit zu laden.</p>";
            return;
        }

        const resp = await fetch(`/api/box/${encodeURIComponent(code)}/availability`);
        const data = await resp.json();

        periods = data.periods || [];
        renderCalendar();
        checkOverlapAndStyle();
    }

    // ----------- Kalender rendern ------------
    function renderCalendar() {
        if (!periods.length) {
            calendar.innerHTML = "<p class='cal-placeholder'>Keine geplanten Leihen für diese Box.</p>";
            return;
        }

        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth();

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startWeekday = (firstDay.getDay() + 6) % 7;

        function isBusy(dateStr) {
            const d = new Date(dateStr);
            return periods.some(p => {
                const s = new Date(p.start);
                const e = new Date(p.end);
                return d >= s && d <= e;
            });
        }

        let html = "<div class='cal-grid'>";
        const labels = ["M","D","M","D","F","S","S"];
        for (const lbl of labels) {
            html += `<div class="cal-day-header">${lbl}</div>`;
        }

        for (let i = 0; i < startWeekday; i++) {
            html += "<div></div>";
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const d = new Date(year, month, day);
            const dateStr = d.toISOString().slice(0, 10);
            const busy = isBusy(dateStr);
            const cls = busy ? "cal-day cal-day-busy" : "cal-day cal-day-free";
            html += `<div class="${cls}">${day}</div>`;
        }

        html += "</div>";

        html += `
            <div class="cal-legend">
                <span><span class="cal-legend-dot busy"></span>belegt</span>
                <span><span class="cal-legend-dot free"></span>frei</span>
            </div>
        `;

        calendar.innerHTML = html;
    }

    // ----------- Live-Overlap-Check ------------
    function checkOverlapAndStyle() {
        ausgabe.classList.remove("input-error");
        rueckgabe.classList.remove("input-error");

        if (!ausgabe.value || !rueckgabe.value) return;

        const start = new Date(ausgabe.value);
        const end = new Date(rueckgabe.value);

        if (end < start) {
            ausgabe.classList.add("input-error");
            rueckgabe.classList.add("input-error");
            return;
        }

        for (const p of periods) {
            const pStart = new Date(p.start);
            const pEnd = new Date(p.end);

            const overlap =
                start <= pEnd &&
                end >= pStart;

            if (overlap) {
                ausgabe.classList.add("input-error");
                rueckgabe.classList.add("input-error");
                return;
            }
        }
    }

});
</script>

{% endblock %}
