<!DOCTYPE html>
<html lang="de" data-theme="themeMountain">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Boxenverwaltung" }}</title>

    <!-- Satoshi Font (Fontshare) -->
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap">

    <!-- Main Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="app-body">

<!-- Top Navigation -->
<header class="navbar">
    <div class="nav-left">
        <div class="logo-icon">📦</div>
        <div class="logo-text">
            <span class="logo-title">Boxenverwaltung</span>
            <span class="logo-subtitle">Labor • Ausleihe</span>
        </div>
    </div>

    <div class="nav-right">
        <nav class="nav-links">
            <a href="{{ url_for('home') }}" class="nav-link">Übersicht</a>
            <a href="{{ url_for('new_loan') }}" class="nav-link nav-link-primary">Neue Leihe</a>
        </nav>

        <!-- Theme Toggle: Mountain ⇄ Forest -->
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Theme wechseln">
            <span id="theme-toggle-label">M</span>
        </button>
    </div>
</header>

<!-- Hauptinhalt -->
<main class="app-main">
    {% block content %}{% endblock %}
</main>

<!-- Bottom Navigation (nur Mobile) -->
<nav class="bottom-nav">
    <a href="{{ url_for('home') }}" class="bottom-nav-item">
        <span class="bottom-nav-icon">🏠</span>
        <span class="bottom-nav-label">Übersicht</span>
    </a>
    <a href="{{ url_for('new_loan') }}" class="bottom-nav-item">
        <span class="bottom-nav-icon">➕</span>
        <span class="bottom-nav-label">Neu</span>
    </a>
</nav>

<!-- Theme Switch Script -->
<script>
(function () {
    const html   = document.documentElement;
    const toggle = document.getElementById("theme-toggle");
    const label  = document.getElementById("theme-toggle-label");

    const THEMES = ["themeMountain", "themeForest"];

    function setTheme(theme) {
        html.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);
        if (label) {
            label.textContent = theme === "themeMountain" ? "M" : "F";
        }
    }

    let saved = localStorage.getItem("theme");
    if (!saved || !THEMES.includes(saved)) {
        saved = "themeMountain";
    }
    setTheme(saved);

    if (toggle) {
        toggle.addEventListener("click", () => {
            const current = html.getAttribute("data-theme") || "themeMountain";
            const next = current === "themeMountain" ? "themeForest" : "themeMountain";
            setTheme(next);
        });
    }
})();
</script>

</body>
</html>
