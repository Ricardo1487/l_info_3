{% extends "base.html" %}

{% block content %}

<section class="page-header">
    <h1 class="page-title">Login</h1>
    <p class="page-subtitle">Melde dich mit deinem Konto an.</p>
</section>

{% if message %}
<div class="alert alert-error">
    {{ message }}
</div>
{% endif %}

<section class="card">

    <form method="POST" class="form">

        <!-- E-Mail -->
        <div class="form-group">
            <label for="email">E-Mail</label>
            <input id="email" name="email" type="email" required>
        </div>

        <!-- Passwort -->
        <div class="form-group">
            <label for="password">Passwort</label>
            <input id="password" name="password" type="password" required>
        </div>

        <button class="btn-primary full-width" style="margin-top: 0.8rem;">
            Login
        </button>

    </form>

    <p style="margin-top: 1rem; font-size: 0.8rem; text-align: center;">
        Kein Konto?
        <a href="{{ url_for('register_page') }}" style="color: var(--primary); text-decoration: none;">
            Jetzt registrieren →
        </a>
    </p>

</section>

{% endblock %}
